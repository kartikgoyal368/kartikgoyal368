name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: kartikgoyal368

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=EF93C4&color_dots=F8BBD0,EF93C4,FF69B4
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=FF69B4&color_dots=F8BBD0,EF93C4,FF69B4

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist

        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
