name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kartikgoyal368

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF69B4&color_dots=%23F8BBD0,%23F8BBD0,%23EF93C4,%23EF93C4,%23FF69B4
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF69B4&color_dots=%231A1017,%23F8BBD0,%23EF93C4,%23FF69B4,%23FF69B4

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Update contribution snake"
